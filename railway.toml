# Frontend service (mendeles-next)
#
# IMPORTANT — Railway Settings for mendeles-next:
#   Root Directory:  (empty — repo root, NOT "frontend")
#   Dockerfile path: Dockerfile.frontend
#
# If Root Directory is "frontend", use Dockerfile path: Dockerfile instead.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.frontend"

[deploy]
startCommand = "node server.js"
restartPolicyType = "ON_FAILURE"
healthcheckPath = "/api/health"
healthcheckTimeout = 120

[env]
# Private network (preferred — no TLS between services):
API_URL = "http://${{eloquent-perfection.RAILWAY_PRIVATE_DOMAIN}}:${{eloquent-perfection.PORT}}"
BACKEND_PUBLIC_HOST = "${{eloquent-perfection.RAILWAY_PUBLIC_DOMAIN}}"
