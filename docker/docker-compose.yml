services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mendeles
      POSTGRES_USER: mendeles
      POSTGRES_PASSWORD: mendeles
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_rbac &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DEBUG: "true"
      DATABASE_URL: postgresql://mendeles:mendeles@db:5432/mendeles
      DJANGO_SECRET_KEY: dev-secret-change-in-production
      JWT_SECRET_KEY: dev-jwt-secret-minimum-32-characters
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      - db

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
